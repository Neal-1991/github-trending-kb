name: daily-trending

on:
  schedule:
    - cron: "0 0 * * *" # UTC 00:00 = 北京时间 08:00
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-trending
  cancel-in-progress: false

jobs:
  # Job A: 抓取、校验、画像、提交数据。通知失败不影响这里的数据落库。
  capture-and-persist:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      date: ${{ steps.job.outputs.date }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Capture snapshot, profile and rebuild DB
        id: job
        env:
          # 优先用 PAT(额度更高),否则回退 Actions 内置 token
          GITHUB_TOKEN: ${{ secrets.GH_PAT || github.token }}
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          GLM_MODEL: ${{ vars.GLM_MODEL || 'glm-4.5-flash' }}
        run: |
          python scripts/daily_job.py --capture-only
          echo "date=$(python -c 'from scripts.daily_job import today_bj; print(today_bj())')" >> "$GITHUB_OUTPUT"

      - name: Commit data
        run: |
          git config user.name "trending-kb-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/daily data/profiles data/raw
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "daily capture $(date -u +%F)"
            for i in 1 2 3; do
              if git pull --rebase --autostash origin main && git push; then break; fi
              if [ "$i" = "3" ]; then exit 1; fi
              sleep 10
            done
          fi

  # Job B: 从 canonical 快照回放并通知。不重新抓取;失败时 Job A 的数据已保留。
  notify:
    needs: capture-and-persist
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # 取 Job A 推送后的最新数据

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Send daily/weekly notification
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_OPEN_ID: ${{ secrets.FEISHU_OPEN_ID }}
          FEISHU_CHAT_ID: ${{ secrets.FEISHU_CHAT_ID }}
        run: python scripts/daily_job.py --notify-only --date ${{ needs.capture-and-persist.outputs.date }}

      - name: Commit delivery log
        if: always()
        run: |
          git config user.name "trending-kb-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/daily/delivery_log.jsonl
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "daily notify $(date -u +%F)"
            for i in 1 2 3; do
              if git pull --rebase --autostash origin main && git push; then break; fi
              if [ "$i" = "3" ]; then exit 1; fi
              sleep 10
            done
          fi

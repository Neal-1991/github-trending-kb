name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project and development tools
        run: pip install -r requirements.lock

      - name: Lint
        run: python -m ruff check .

      - name: Test
        run: python -m pytest -p no:cacheprovider

      - name: Audit committed source data
        run: python scripts/audit_data.py

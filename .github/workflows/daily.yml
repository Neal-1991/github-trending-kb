name: daily-trending

on:
  schedule:
    - cron: "0 0 * * *" # UTC 00:00 = 北京时间 08:00
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-trending
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run daily job
        env:
          # 优先用 PAT(额度更高),否则回退 Actions 内置 token
          GITHUB_TOKEN: ${{ secrets.GH_PAT || github.token }}
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          GLM_MODEL: ${{ vars.GLM_MODEL || 'glm-4.5-flash' }}
          # 飞书二选一:群机器人 webhook 或 自建应用(可私聊)
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_OPEN_ID: ${{ secrets.FEISHU_OPEN_ID }}
          FEISHU_CHAT_ID: ${{ secrets.FEISHU_CHAT_ID }}
        run: python scripts/daily_job.py

      - name: Commit data
        run: |
          git config user.name "trending-kb-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/daily data/profiles data/raw
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "daily trends $(date -u +%F)"
            git push
          fi
